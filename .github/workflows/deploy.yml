name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-3
      AWS_ROLE_ARN: arn:aws:iam::363191779144:role/epita-cloud-dev
      TF_DIR: infrastructure
      APP_DIR: epita-cloud
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/epita-cloud-backend
      ASG_NAME: epita-cloud-asg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE_NAME:latest ./$APP_DIR
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push $IMAGE_NAME:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve \
            -var="docker_image=${{ env.IMAGE_NAME }}:latest" \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Get Cognito issuer URI and ALB DNS name
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "COGNITO_ISSUER_URI=$(terraform output -raw cognito_issuer_uri)" >> $GITHUB_ENV
          echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV

      - name: Roll out new image (ASG rolling instance refresh)
        run: |
          set -e
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name $ASG_NAME \
            --max-records 1 \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "None")

          if [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Cancelling" ]; then
            echo "A previous instance refresh is $STATUS - cancelling it so this deploy can proceed."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name $ASG_NAME || true

            for i in $(seq 1 30); do
              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name $ASG_NAME \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' \
                --output text)
              echo "waiting for previous refresh to stop (status: $STATUS)"
              case "$STATUS" in
                Cancelled|Successful|Failed|RollbackSuccessful|RollbackFailed) break ;;
              esac
              sleep 10
            done
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'

      - name: Print app URL
        run: |
          echo "App is served through the load balancer at: http://$ALB_DNS_NAME"
